# General GPIO & Clock (Kristal 32.768 kHz NY2)
CONFIG_GPIO=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=n

# Bluetooth LE Observer
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_BROADCASTER=n
CONFIG_BT_CENTRAL=n
CONFIG_BT_PERIPHERAL=n

# Nordic SoftDevice Controller (Optimasi Assembly & Direct DMA nRF52840)
CONFIG_BT_LL_SOFTDEVICE=y

# High-Density Scanning Event Buffers (255 Buffer Descriptor untuk 1200+ pkt/s)
CONFIG_BT_BUF_EVT_DISCARDABLE_COUNT=255
CONFIG_BT_BUF_EVT_DISCARDABLE_SIZE=255

# Hardware UART (UARTE) ke ESP32 @ 1 Mbps (Pin D6/TX & D7/RX)
CONFIG_SERIAL=y
CONFIG_UART_NRFX=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_0_NRF_TX_BUFFER_SIZE=256

# Hardware Watchdog Timer (Auto-Recovery 24/7)
CONFIG_WATCHDOG=y
CONFIG_WDT_NRFX=y
CONFIG_HWINFO=y

# USB CDC ACM Serial Backend (Virtual COM Port Laptop)
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_USE_SEGGER_RTT=n
CONFIG_RTT_CONSOLE=n

# Stack Sizes
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_BT_RX_STACK_SIZE=2048

# Standard C Library formatting
CONFIG_CBPRINTF_FP_SUPPORT=y